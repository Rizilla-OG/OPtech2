//
// This is an alternate startup script
// for Yamagi Quake II, overriding the
// default.cfg from pak0.pak. 
//
// !!! PLEASE DO NOT ALTER THIS FILE !!!
//
// Instead, put your custom stuff in
// autoexec.cfg. It's also executed
// at startup.
//

//
// KEY BINDINGS
//

unbindall

bind	1		"use Blaster"
bind	2		"use Shotgun"
bind	3		"use Super Shotgun"
bind	4		"use Machinegun"
bind	5		"use Chaingun"
bind	6		"use Grenade Launcher"
bind	7		"use Rocket Launcher"
bind	8		"use HyperBlaster"
bind	9		"use Railgun"
bind	0		"use BFG10K"

bind	MOUSE1		+attack

// optech2: WASD (was ESDF, with A and G turning)
bind	w		+forward
bind	s		+back
bind	a		+moveleft
bind	d		+moveright

bind	TAB		inven
bind	ENTER		invuse
bind	o		invprev
bind	p		invnext
bind	BACKSPACE	invdrop

bind	MWHEELDOWN	weapprev
bind	MWHEELUP	weapnext

// optech2: the weapon and powerup wheels, keys as in the re-release (E
// weapons, Q powerups; the power shield and quad damage are on the
// powerup wheel)
bind	e		+wheel
bind	q		+wheel2

// optech2: gamepad, as the re-release's own default.cfg sets it up
bind	TRIG_RIGHT	+attack
bind	TRIG_LEFT	+moveup
bind	BTN_SOUTH	+moveup
bind	BTN_EAST	+movedown
bind	BTN_WEST	"cmd help"
bind	STICK_LEFT	+movedown
bind	STICK_RIGHT	centerview
bind	SHOULDR_RIGHT	+wheel
bind	SHOULDR_LEFT	+wheel2
bind	DP_LEFT		cl_weapprev
bind	DP_RIGHT	cl_weapnext
bind	DP_UP		"wave 4"

bind	SHIFT		+speed

bind	SPACE		+movedown
bind	MOUSE2		+moveup

bind	PAUSE		pause

bind	F1		"cmd help"
bind	F5		"echo Quick Saving...; wait; save quick"
bind	F9		"echo Quick Loading...; wait; load quick"
bind	F12		screenshot jpg 90

bind	t		messagemode

//----------------------------------------------

//
// DEFAULT CVARS
//

set	viewsize	100
set	vid_fullscreen	0
set	sensitivity	3
set	crosshair	1
set	cl_run		1
set	hand		0
set	m_pitch		0.022
set	m_yaw		0.022
set	m_forward	1
set	m_side		0.8
set	lookspring	0
set	lookstrafe	0
set	freelook	1
